[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyano-curve"
version = "0.1.0"
description = "Calibrador multi-metodo de curvas para negativos digitales de cianotipo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cyano Curve contributors" },
]
keywords = [
  "cyanotype",
  "alternative-process",
  "digital-negative",
  "calibration",
  "photoshop",
  "gimp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy",
  "opencv-python",
  "Pillow",
  "scipy",
]

[project.urls]
Homepage = "https://github.com/koshiro/cyanotype_curves_calculator"
Repository = "https://github.com/koshiro/cyanotype_curves_calculator"
Issues = "https://github.com/koshiro/cyanotype_curves_calculator/issues"

[project.optional-dependencies]
dev = [
  "pytest",
]
gui = [
  "PySide6",
]

[project.scripts]
cyano-curve = "cyano_curve.cli:main"
cyano-curve-gui = "cyano_curve.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
